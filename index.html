<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<meta name="description" content="데블스 플랜 3 히든 워드 — 오프라인 한국어 Word2Vec 유사도 엔진으로 즐기는 AI 추리 게임">
<title>HIDDEN WORD · 데블스 플랜 3</title>
<style>
:root{
  --bg:#07070a; --bg2:#0b0b10; --card:#111117; --card2:#17171f; --line:#262632;
  --gold:#e2b74e; --gold2:#f8e0a0; --cyan:#4fd8e8; --red:#ff5470; --green:#5ee0a0;
  --txt:#ececf3; --dim:#9b9bb0; --dim2:#6d6d82;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(900px 500px at 15% -10%, rgba(226,183,78,.10), transparent 60%),
    radial-gradient(700px 400px at 100% 0%, rgba(79,216,232,.07), transparent 55%),
    var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:16px; line-height:1.55; min-height:100vh;
  padding-bottom:40px;
}
.app{max-width:760px;margin:0 auto;padding:18px 16px 0}
.hidden{display:none !important}

/* ---------- header ---------- */
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:6px 2px 14px}
.topbar .row{flex:0 0 auto;flex-wrap:nowrap}
.topbar .brand{flex:1 1 auto;min-width:0}
.brand h1{
  margin:0;font-size:22px;letter-spacing:.22em;white-space:nowrap;font-weight:800;
  background:linear-gradient(100deg,#fff 0%,var(--gold2) 45%,var(--gold) 70%,#a9832f 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  font-family:"Optima","Times New Roman",serif;
}
.brand .sub{margin-top:6px;font-size:12px;color:var(--dim);letter-spacing:.06em}
.brand .sub b{color:var(--gold);font-weight:600}
.iconbtn{
  min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
  background:#101018;color:var(--gold);font-size:16px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px
}
.iconbtn:active{transform:scale(.97)}
.iconbtn small{color:var(--dim);font-size:12px;letter-spacing:.02em}

/* ---------- scorebar ---------- */
.scorebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border:1px solid var(--line);background:linear-gradient(180deg,#12121a,#0d0d13);
  border-radius:14px;padding:10px 12px;margin-bottom:14px;font-size:13px}
.sb-item{display:flex;align-items:center;gap:6px;color:var(--dim)}
.sb-item b{color:var(--txt);font-size:15px;font-variant-numeric:tabular-nums}
.sb-item.me b{color:var(--gold2)}
.sb-item.ai b{color:var(--cyan)}
.sb-sep{width:1px;height:18px;background:var(--line)}
.pieces{display:flex;gap:4px}
.piece{width:11px;height:11px;border-radius:50%;background:#2a2a38;border:1px solid #33334a}
.piece.on{background:radial-gradient(circle at 35% 30%,#fff3cf,var(--gold));border-color:#8d6f22;box-shadow:0 0 8px rgba(226,183,78,.5)}

/* ---------- tabs ---------- */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#0d0d13;
  border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:16px;position:sticky;top:0;z-index:30;
  box-shadow:0 8px 18px rgba(0,0,0,.55)}
.tab{border:0;background:transparent;color:var(--dim);font-size:14px;font-weight:600;
  padding:11px 6px;border-radius:10px;cursor:pointer;letter-spacing:.02em}
.tab.active{background:linear-gradient(180deg,#242433,#1a1a24);color:var(--gold2);
  box-shadow:inset 0 0 0 1px rgba(226,183,78,.35)}
.tab.hot{color:#8fe3ef}
.tab.hot.active{color:#d6fbff;box-shadow:inset 0 0 0 1px rgba(79,216,232,.42);
  background:linear-gradient(180deg,#123038,#0e2027)}
.tab:active{transform:scale(.99)}

/* ---------- cards ---------- */
.card{background:linear-gradient(180deg,#121219,#0e0e14);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card.tight{padding:13px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-title{font-size:14px;font-weight:700;letter-spacing:.04em;color:#d9d9e6;display:flex;align-items:center;gap:8px}
.card-title .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.lead{font-size:13.5px;color:var(--dim);margin:0 0 12px}
.lead b{color:#dcdce8;font-weight:600}
.mono{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{appearance:none;border:1px solid var(--line);background:#1a1a24;color:var(--txt);
  border-radius:12px;padding:13px 16px;font-size:15px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;white-space:nowrap;
  transition:transform .06s ease, background .15s ease}
.btn:active{transform:scale(.985)}
.btn.primary{background:linear-gradient(180deg,#f3d27c,#d3a53c);color:#1a1405;border-color:#8d6f22;
  box-shadow:0 6px 18px rgba(226,183,78,.20)}
.btn.ghost{background:#12121a}
.btn.cyan{background:linear-gradient(180deg,#7fe7f2,#3ab6c9);color:#04191d;border-color:#2b8c9c}
.btn.danger{background:#2a121a;border-color:#5d2434;color:#ffb3c1}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row.grow>*{flex:1 1 0;padding-left:10px;padding-right:10px}

/* ---------- candidates ---------- */
.cands{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.chip{position:relative;border:1px solid var(--line);background:#15151d;color:var(--txt);border-radius:14px;
  padding:14px 10px;text-align:center;cursor:pointer;transition:all .12s ease}
.chip .tag{position:absolute;top:6px;left:8px;font-size:10px;color:var(--dim2);letter-spacing:.1em}
.chip .w{font-size:17px;font-weight:700;letter-spacing:.02em}
.chip .hintline{font-size:11px;color:var(--dim);margin-top:3px}
.chip:active{transform:scale(.985)}
.chip.sel{border-color:var(--gold);background:linear-gradient(180deg,rgba(226,183,78,.16),rgba(226,183,78,.04));
  box-shadow:0 0 0 1px rgba(226,183,78,.4),0 8px 20px rgba(226,183,78,.10)}
.chip.sel .w{color:var(--gold2)}
.chip.answer-ok{border-color:var(--green);background:rgba(94,224,160,.10)}
.chip.answer-no{border-color:var(--red);background:rgba(255,84,112,.10)}
.chip.dimmed{opacity:.4}
.chip .pick{position:absolute;top:6px;right:8px;font-size:11px;color:var(--gold2)}

/* ---------- hint list ---------- */
.hints{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.hint{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;
  background:#101017;border:1px solid #1e1e29;border-radius:11px;padding:9px 11px}
.hint .no{font-size:11px;color:var(--dim2);font-variant-numeric:tabular-nums}
.hint .body .wline{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.hint .body .w{font-weight:700;font-size:15.5px}
.hint .body .s{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.hint .bar{height:5px;background:#1d1d28;border-radius:4px;overflow:hidden;margin-top:6px}
.hint .bar i{display:block;height:100%;border-radius:4px;transition:width .45s ease}
.hint.top{border-color:rgba(226,183,78,.55);background:linear-gradient(90deg,rgba(226,183,78,.12),rgba(226,183,78,.02))}
.hint.flash{animation:flash .6s ease}
@keyframes flash{0%{background:rgba(226,183,78,.28)}100%{background:transparent}}
.hint-empty{text-align:center;color:var(--dim2);font-size:13px;padding:22px 0}
.stagebar{display:flex;gap:6px;margin:2px 0 12px}
.stage{flex:1;text-align:center;font-size:11px;color:var(--dim2);border:1px solid #1f1f2a;border-radius:8px;padding:6px 2px}
.stage.on{color:var(--gold2);border-color:rgba(226,183,78,.5);background:rgba(226,183,78,.07)}

/* ---------- gauge ---------- */
.gaugewrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.gauge{--p:0;--c:var(--cyan);position:relative;width:132px;height:132px;border-radius:50%;
  background:conic-gradient(var(--c) calc(var(--p) * 1%), #1b1b26 0);
  flex:0 0 132px}
.gauge::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#0e0e15;
  box-shadow:inset 0 0 24px rgba(0,0,0,.7)}
.gauge .val{position:absolute;inset:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;text-align:center;line-height:1}
.gauge .val b{font-size:33px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.gauge .val b span{font-size:14px;font-weight:700;margin-left:1px}
.gauge .val em{font-style:normal;display:block;font-size:8.5px;color:var(--dim2);letter-spacing:.16em;margin-top:5px}
.gauge.danger{--c:var(--red);filter:drop-shadow(0 0 12px rgba(255,84,112,.45))}
.gauge.mid{--c:var(--gold)}
.gauge.low{--c:var(--cyan)}

.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1 1 220px}
.metric{background:#101017;border:1px solid #1e1e29;border-radius:12px;padding:10px}
.metric .k{font-size:10.5px;color:var(--dim2);letter-spacing:.04em}
.metric .v{font-size:20px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.metric .sub{font-size:10.5px;color:var(--dim);margin-top:2px}
.mbar{height:4px;background:#1d1d28;border-radius:3px;overflow:hidden;margin-top:7px}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,#3ab6c9,#e2b74e)}

/* ---------- badges / notes ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
  padding:4px 9px;border-radius:999px;border:1px solid #2a2a38;color:var(--dim);background:#12121a}
.badge.gold{color:var(--gold2);border-color:rgba(226,183,78,.45);background:rgba(226,183,78,.10)}
.badge.cyan{color:#9becf6;border-color:rgba(79,216,232,.4);background:rgba(79,216,232,.10)}
.badge.red{color:#ffb0bd;border-color:rgba(255,84,112,.45);background:rgba(255,84,112,.10)}
.badge.green{color:#a6f2cc;border-color:rgba(94,224,160,.4);background:rgba(94,224,160,.10)}
.note{font-size:12.5px;color:var(--dim);border-left:2px solid #2c2c3b;padding:2px 0 2px 10px;margin:10px 0 0}
.note.warn{border-color:var(--red);color:#ffbcc7;background:rgba(255,84,112,.06);padding:10px 12px;border-radius:10px}
.note.gold{border-color:var(--gold);color:#f0dda6;background:rgba(226,183,78,.06);padding:10px 12px;border-radius:10px}
.tips{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.tips li{font-size:12.5px;color:#c9c9d8;background:#12121a;border:1px solid #1e1e29;border-radius:9px;padding:8px 10px}
.tips li::before{content:"▸";color:var(--gold);margin-right:6px}

/* ---------- inputs ---------- */
.field{display:flex;flex-direction:column;gap:6px;flex:1 1 160px}
.field label{font-size:11.5px;color:var(--dim);letter-spacing:.03em}
input[type=text],input[type=password],select{
  width:100%;background:#0c0c12;border:1px solid #262634;border-radius:11px;color:var(--txt);
  padding:12px 13px;font-size:16px;font-family:inherit;outline:none;min-height:46px}
input:focus,select:focus{border-color:rgba(226,183,78,.6);box-shadow:0 0 0 3px rgba(226,183,78,.10)}
input::placeholder{color:#5a5a70}
.inline{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}

/* ---------- persona ---------- */
.personas{display:flex;flex-direction:column;gap:9px}
.persona{background:#101017;border:1px solid #1f1f2a;border-radius:13px;padding:12px}
.persona.hit{border-color:rgba(255,84,112,.5);background:rgba(255,84,112,.06)}
.persona.safe{border-color:rgba(94,224,160,.35);background:rgba(94,224,160,.05)}
.persona .ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
.persona .nm{font-weight:800;font-size:14.5px}
.persona .st{font-size:11px;color:var(--dim)}
.persona .say{font-size:12.5px;color:#c3c3d4;margin-top:7px;word-break:keep-all}
.rank{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.rank span{font-size:11px;border:1px solid #26263a;border-radius:7px;padding:3px 7px;color:var(--dim)}
.rank span.first{color:var(--gold2);border-color:rgba(226,183,78,.45);background:rgba(226,183,78,.08)}

/* ---------- result ---------- */
.result{text-align:center;padding:8px 0 2px}
.result .big{font-size:30px;font-weight:900;letter-spacing:.02em}
.result .big.ok{color:var(--green)}
.result .big.no{color:var(--red)}
.result .sm{color:var(--dim);font-size:13px;margin-top:4px}
.coin{font-variant-numeric:tabular-nums;color:var(--gold2);font-weight:800}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.66);backdrop-filter:blur(4px);padding:0}
.modal-box{width:100%;max-width:720px;max-height:88vh;overflow:auto;background:linear-gradient(180deg,#15151e,#0d0d13);
  border:1px solid #2a2a38;border-radius:20px 20px 0 0;padding:18px 18px 26px}
@media(min-width:760px){.modal{align-items:center}.modal-box{border-radius:20px}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.modal-head h2{margin:0;font-size:17px;letter-spacing:.02em}
.modal-body{font-size:13.5px;color:#cfcfdd;line-height:1.68}
.modal-body h3{font-size:13px;color:var(--gold2);margin:16px 0 6px;letter-spacing:.04em}
.modal-body ul{margin:0;padding-left:18px}
.modal-body li{margin:3px 0}
.modal-body table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12.5px}
.modal-body th,.modal-body td{border:1px solid #26263a;padding:7px 8px;text-align:center}
.modal-body th{background:#181822;color:var(--gold2);font-weight:600}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#1d1d29;border:1px solid #34344a;color:#eee;padding:11px 16px;border-radius:12px;font-size:13px;
  z-index:120;transition:all .22s ease;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- misc ---------- */
.foot{text-align:center;color:var(--dim2);font-size:11.5px;padding:18px 0 6px;line-height:1.7}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px;color:var(--dim)}
.kv b{color:#dcdce8;font-weight:600;text-align:right}
.divider{height:1px;background:linear-gradient(90deg,transparent,#26263a,transparent);margin:14px 0}
.difftabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.difftab{border:1px solid #24242f;background:#111119;border-radius:10px;padding:10px 6px;color:var(--dim);
  font-size:12.5px;font-weight:600;cursor:pointer}
.difftab.on{border-color:rgba(226,183,78,.55);color:var(--gold2);background:rgba(226,183,78,.08)}
.difftab small{display:block;font-weight:400;font-size:10.5px;color:var(--dim2);margin-top:2px}
.labform{display:flex;flex-direction:column;gap:10px}
.recent{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.recent .r{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);
  border-bottom:1px dashed #1f1f2b;padding-bottom:5px}
.recent .r b{color:#dcdce8}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--dim2);margin-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}


/* ---------- online room (mp) ---------- */
.mp-roomhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mp-codewrap{display:flex;align-items:baseline;gap:8px}
.mp-code-label{font-size:10px;letter-spacing:.2em;color:var(--dim2)}
.mp-code{font-size:26px;font-weight:800;letter-spacing:.05em;color:var(--gold2);font-variant-numeric:tabular-nums;line-height:1.1}
.mp-codesub{font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:6px;margin-top:3px}
.okdot,.noodot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 auto}
.okdot{background:#5ee0a0;box-shadow:0 0 6px rgba(94,224,160,.8)}
.noodot{background:#ff5470;box-shadow:0 0 6px rgba(255,84,112,.7)}
.mp-players{display:flex;flex-direction:column;gap:6px}
.mp-p{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 9px;border-radius:10px;
  background:#101017;border:1px solid #1c1c27}
.mp-p.me{border-color:rgba(226,183,78,.42);background:rgba(226,183,78,.06)}
.mp-p.off{opacity:.55}
.mp-p .live{width:7px;height:7px;border-radius:50%;background:#3b3b4c;flex:0 0 auto}
.mp-p .live.on{background:#5ee0a0}
.mp-p .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-weight:600;color:#e6e6f0}
.mp-p .nm i{font-style:normal;color:var(--gold);font-size:10.5px;margin-left:2px}
.mp-p .nm .hostmark{font-size:9.5px;color:#9becf6;border:1px solid rgba(79,216,232,.4);
  border-radius:5px;padding:1px 4px;margin-left:4px;font-weight:600;vertical-align:1px}
.mp-p .sc{font-variant-numeric:tabular-nums;color:var(--gold2);font-weight:700}
.mp-mini{font-size:10.5px;color:var(--dim);border:1px solid #26263a;border-radius:6px;padding:2px 6px;white-space:nowrap}
.mp-mini.ok{color:#a6f2cc;border-color:rgba(94,224,160,.45);background:rgba(94,224,160,.08)}
.mp-mini.gold{color:var(--gold2);border-color:rgba(226,183,78,.45);background:rgba(226,183,78,.08)}
.mp-kick{margin-left:auto;font-size:10.5px;border:1px solid #3a2530;background:#1c1218;color:#ffb3c1;
  border-radius:7px;padding:3px 7px;cursor:pointer}
.mp-turn{font-size:12.5px;color:var(--dim);margin:0 0 2px}
.mp-turn b{color:#e6e6f0}
.mp-badge-line:empty{display:none}
.mp-invite{background:#0c0c12;border:1px solid #22222f;border-radius:10px;padding:9px 11px;
  font-size:11.5px;color:#9becf6;word-break:break-all;margin-top:2px}
.mp-invite code{font-family:inherit}
.mp-mine{margin-top:6px}
.mp-word{display:inline-block;font-size:12.5px;border:1px solid #26263a;border-radius:8px;
  padding:4px 9px;color:#cfcfdd;background:#12121a}
.mp-word.on{border-color:rgba(226,183,78,.5);color:var(--gold2);background:rgba(226,183,78,.08)}
.mp-answers{display:flex;flex-direction:column;gap:6px}
.mp-ans{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:12.5px;
  padding:8px 10px;border-radius:10px;background:#101017;border:1px solid #1e1e29}
.mp-ans.hit{border-color:rgba(94,224,160,.45);background:rgba(94,224,160,.07)}
.mp-ans .nm{font-weight:600;color:#e6e6f0}
.mp-ans .nm i{font-style:normal;color:var(--gold);font-size:10px}
.mp-ans .wd{color:#c9c9d8;word-break:keep-all}
.mp-ans .mk{font-weight:800;color:#7d7d94}
.mp-ans.hit .mk{color:#5ee0a0}
.mp-ranks,.mp-hlist{display:flex;flex-direction:column;gap:6px}
.mp-rankrow{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;font-size:13.5px;
  padding:9px 10px;border-radius:10px;background:#101017;border:1px solid #1e1e29}
.mp-rankrow.me{border-color:rgba(226,183,78,.45);background:rgba(226,183,78,.06)}
.mp-rankrow .rk{font-weight:800;color:var(--gold2);text-align:center}
.mp-rankrow .sc{font-variant-numeric:tabular-nums;color:var(--gold2);font-weight:800}
.mp-hrow{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center;font-size:11.5px;
  padding:7px 9px;border-radius:9px;background:#101017;border:1px solid #1e1e29;color:var(--dim)}
.mp-hrow .r{color:var(--dim2)}
.mp-hrow .h{color:#dcdce8;font-weight:600}

        else if (key === 'a' && w.a.indexOf(tname) < 0) w.a.push(tname);
        else if (key === 'h' && w.h.indexOf(tname) < 0) w.h.push(tname);
        else if (key === 'u' && w.u.indexOf(tname) < 0) w.u.push(tname);
        else if (key === 'c' && w.c.indexOf(tname) < 0) w.c.push(tname);
      }
    }
  }

  /* ---------- build relation graph ---------- */
  var TYPE_KO = { s: '동의어', h: '상위어', u: '하위어', c: '공기어', a: '반의어', x: '연관 관계' };
  var STRENGTH = { s: 0.97, h: 0.62, u: 0.62, c: 0.60, a: 0.48, x: 0.40 };

  function link(a, b, type, strength) {
    if (!a || !b || a === b) return;
    var map = LINK.get(a);
    if (!map) { map = new Map(); LINK.set(a, map); }
    var cur = map.get(b);
    if (!cur || cur.s < strength) {
      map.set(b, { s: strength, t: type, ant: type === 'a' });
    }
  }

  LIST.forEach(function (w) {
    LINK.set(w.n, new Map());
  });

  // symmetrize + inverse hypernym links
  LIST.forEach(function (w) {
    w.s.forEach(function (t) { link(w.n, t, 's', STRENGTH.s); link(t, w.n, 's', STRENGTH.s); });
    w.a.forEach(function (t) { link(w.n, t, 'a', STRENGTH.a); link(t, w.n, 'a', STRENGTH.a); });
    w.c.forEach(function (t) { link(w.n, t, 'c', STRENGTH.c); link(t, w.n, 'c', STRENGTH.c); });
    w.h.forEach(function (t) {
      link(w.n, t, 'h', STRENGTH.h);
      link(t, w.n, 'u', STRENGTH.h);
      var tw = WORDS[t];
      if (tw && tw.u.indexOf(w.n) < 0) tw.u.push(w.n);
    });
    w.u.forEach(function (t) {
      link(w.n, t, 'u', STRENGTH.u);
      link(t, w.n, 'h', STRENGTH.h);
      var tw = WORDS[t];
      if (tw && tw.h.indexOf(w.n) < 0) tw.h.push(w.n);
    });
  });

  // tag links: a dictionary word used as another word's context tag is a weak co-occurrence
  LIST.forEach(function (w) {
    w.tags.forEach(function (t) {
      if (WORDS[t]) link(w.n, t, 'c', 0.42);
    });
  });

  // two-hop association through synonym / co-occurrence edges only
  var twoHop = new Map();
  LINK.forEach(function (map, from) {
    var acc = new Map();
    map.forEach(function (v1, mid) {
      if (v1.t !== 's' && v1.t !== 'c') return;
      var m2 = LINK.get(mid);
      if (!m2) return;
      m2.forEach(function (v2, to) {
        if (to === from) return;
        if (map.has(to)) return;
        var st = v1.s * v2.s * 0.62;
        if (st < 0.12) return;
        var cur = acc.get(to);
        if (!cur || cur.s < st) acc.set(to, { s: st, t: 'x', ant: false });
      });
    });
    twoHop.set(from, acc);
  });

  twoHop.forEach(function (acc, from) {
    var map = LINK.get(from);
    acc.forEach(function (v, to) {
      var cur = map.get(to);
      if (!cur) map.set(to, v);
    });
  });

  /* ---------- similarity core ---------- */
  function cos(A, B) {
    var dot = 0, na = 0, nb = 0;
    for (var i = 0; i < ND; i++) {
      var x = A[i], y = B[i];
      dot += x * y; na += x * x; nb += y * y;
    }
    if (!na || !nb) return 0;
    return dot / Math.sqrt(na * nb);
  }

  function tagOverlap(A, B) {
    var inter = 0;
    for (var i = 0; i < A.tags.length; i++) if (B.tagSet[A.tags[i]]) inter++;
    return inter;
  }

  function resolveWord(raw) {
    var name = String(raw == null ? '' : raw).trim();
    if (!name) return null;
    var cached = RESOLVE.get(name);
    if (cached) return cached;
    var out;
    if (WORDS[name]) {
      out = { n: name, w: WORDS[name], oov: false, lex: 1, proxy: null };
    } else {
      var best = null, bestSim = 0;
      for (var i = 0; i < LIST.length; i++) {
        var s = lexSim(name, LIST[i].n);
        if (s > bestSim) { bestSim = s; best = LIST[i]; }
      }
      if (best && bestSim >= 0.40) {
        out = { n: name, w: best, oov: true, lex: bestSim, proxy: best.n };
      } else {
        out = { n: name, w: null, oov: true, lex: bestSim, proxy: null };
      }
    }
    RESOLVE.set(name, out);
    return out;
  }

  function buildTips(r) {
    var tips = [];
    if (r.same) {
      tips.push('히든 워드와 완전히 같은 단어입니다. 유사도 100% — 힌트로는 사용할 수 없습니다.');
      return tips;
    }
    if (r.relType === '반의어') {
      tips.push('반의어 관계입니다. 의미는 반대지만 늘 함께 쓰여 관계 구조 점수는 높게 잡힙니다. 상대를 흔드는 함정 힌트로 적합합니다.');
    } else if (r.relType === '동의어') {
      tips.push('동의어 관계 — 정답을 거의 그대로 노출합니다.');
    } else if (r.relType === '상위어' || r.relType === '하위어') {
      tips.push('상위어-하위어 관계입니다. 범주를 좁혀 주는 안전한 힌트입니다.');
    } else if (r.relType === '공기어') {
      tips.push('공기어(함께 자주 쓰이는 단어) 관계입니다. 자연스러운 연상 힌트입니다.');
    } else if (r.relType === '연관 관계') {
      tips.push('두 단계로 이어진 연관 관계입니다. 직접 관계는 아닙니다.');
    }
    if (r.poly.length) {
      tips.push('다의어 주의: ' + r.poly.map(function (p) { return "'" + p + "'"; }).join(', ') + ' — 다른 뜻으로 읽히면 유사도가 왜곡됩니다.');
    }
    if (r.total > 95) tips.push('95% 초과 — 힌트로 제시하면 그 즉시 힌트 제시가 종료됩니다.');
    else if (r.total >= 85) tips.push('85% 이상 — 매우 강한 힌트입니다. 정답이 쉽게 드러납니다.');
    else if (r.total >= 65) tips.push('65~85% — 힌트로 쓰기 좋은 구간입니다.');
    else if (r.total >= 40) tips.push('40~65% — 추리가 필요한 중간 강도입니다.');
    else if (r.total < 25) tips.push('25% 미만 — 사실상 무관어입니다. 상대를 속이는 낚시 힌트로 쓸 수 있습니다.');
    if (r.oov.length) {
      tips.push('사전에 없는 단어(' + r.oov.join(', ') + ')는 형태 유사도로 근사했습니다. 정확도가 낮습니다.');
    }
    return tips;
  }

  function similarity(a, b) {
    var A = resolveWord(a);
    var B = resolveWord(b);
    if (!A || !B) {
      return { ok: false, err: '두 단어를 모두 입력해 주세요.', a: String(a || ''), b: String(b || '') };
    }
    var same = A.n === B.n && A.oov === false && B.oov === false;
    var ck = same ? null : (A.n < B.n ? A.n + '\u0001' + B.n : B.n + '\u0001' + A.n);
    if (ck && CACHE.has(ck)) {
      var hit = CACHE.get(ck);
      return Object.assign({}, hit, { a: A.n, b: B.n });
    }

    if (!A.w || !B.w) {
      var lx = lexSim(A.n, B.n);
      var tot0 = clamp(Math.round(lx * 46), 1, 45);
      var res0 = {
        ok: true, a: A.n, b: B.n, total: tot0, same: false,
        sem: 0, semDist: 100, ctx: 0, rel: 0, relScore: 0, relType: '없음',
        lex: lx, poly: [], oov: [A.w ? null : A.n, B.w ? null : B.n].filter(Boolean),
        ant: false, proxy: null
      };
      res0.tips = buildTips(res0);
      return res0;
    }

    var inter = tagOverlap(A.w, B.w);
    var nA = A.w.tags.length || 1, nB = B.w.tags.length || 1;
    var dice = (2 * inter) / (nA + nB);

    var sem0 = cos(A.w.v, B.w.v);
    var sem = sem0 * (0.68 + 0.32 * dice);

    var ctx = clamp((inter / Math.sqrt(nA * nB)) * 0.85 + dice * 0.15, 0, 1);

    var aKey = A.proxy || A.n;
    var bKey = B.proxy || B.n;
    var linkObj = null;
    if (aKey === bKey) {
      linkObj = null;
    } else {
      var lm = LINK.get(aKey);
      if (lm) linkObj = lm.get(bKey);
      if (!linkObj) {
        var lm2 = LINK.get(bKey);
        if (lm2) linkObj = lm2.get(aKey);
      }
    }
    var rel = linkObj ? linkObj.s : 0;
    var ant = !!(linkObj && linkObj.ant);
    var relType = linkObj ? (TYPE_KO[linkObj.t] || '연관 관계') : '없음';

    var lex = lexSim(A.n, B.n);

    var base = 1 - (1 - 0.63 * sem) * (1 - 0.50 * ctx) * (1 - 0.92 * rel) * (1 - 0.16 * lex);
    if (ant) base *= 0.58;

    var oovList = [];
    var damp = 1;
    if (A.oov) { oovList.push(A.n); damp = Math.min(damp, 0.5 + 0.5 * A.lex); }
    if (B.oov) { oovList.push(B.n); damp = Math.min(damp, 0.5 + 0.5 * B.lex); }
    base *= damp;

    var total = Math.round(100 * Math.pow(clamp(base, 0, 0.995), 0.70));
    if (same) total = 100;
    total = clamp(total, 1, 100);

    var res = {
      ok: true, a: A.n, b: B.n, total: total, same: same,
      sem: Math.round(sem0 * 100), semDist: Math.round((1 - sem0) * 100),
      ctx: Math.round(ctx * 100), rel: Math.round(rel * 100), relScore: Math.round(rel * 100),
      relType: relType, relRaw: rel, lex: Math.round(lex * 100),
      poly: (A.w.poly ? [A.n] : []).concat(B.w.poly ? [B.n] : []),
      oov: oovList, ant: ant,
      proxy: (A.proxy ? A.n + '→' + A.proxy : (B.proxy ? B.n + '→' + B.proxy : null))
    };
    res.tips = buildTips(res);
    if (ck) CACHE.set(ck, res);
    return res;
  }

  /* ---------- candidate selection ---------- */
  function primaryDomain(w) {
    var best = -1, bi = -1;
    for (var i = 0; i < ND; i++) if (w.v[i] > best) { best = w.v[i]; bi = i; }
    return bi;
  }

  function bySeed(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  function pickCandidates(hiddenRaw, n, rng, seed) {
    n = n || 5;
    rng = rng || (seed !== undefined ? bySeed(seed) : Math.random);
    var H = resolveWord(hiddenRaw);
    if (!H || !H.w) return null;
    var hw = H.w;
    var scored = [];
    for (var i = 0; i < LIST.length; i++) {
      var w = LIST[i];
      if (w.n === H.n) continue;
      var s = similarity(H.n, w.n);
      if (s.total < 24 || s.total > 64) continue;
      var domShared = 0;
      for (var k = 0; k < ND; k++) if (w.v[k] && hw.v[k]) domShared += Math.min(w.v[k], hw.v[k]);
      var sc = (s.detail = 0), sc2 = 0;
      sc2 += (s.total >= 32 && s.total <= 56) ? 4 : 2;
      sc2 += Math.min(6, domShared * 0.8);
      sc2 += rng() * 2.6;
      scored.push({ w: w, sc: sc2, sim: s.total });
    }
    scored.sort(function (x, y) { return y.sc - x.sc; });
    var out = [{ n: H.n, sim: 100 }];
    for (var j = 0; j < scored.length && out.length < n; j++) {
      var cand = scored[j];
      var ok = true;
      for (var m = 0; m < out.length; m++) {
        if (candidateTooClose(cand.w.n, out[m].n)) { ok = false; break; }
      }
      if (ok) out.push({ n: cand.w.n, sim: cand.sim });
    }
    return out;
  }

  function candidateTooClose(a, b) {
    if (a === b) return true;
    var s = similarity(a, b);
    return s.total > 78;
  }

  /* ---------- hint generation (AI submitter) ---------- */
  var DIFF = {
    easy:   { band: [66, 93], disc: [16, 999], label: '쉬움' },
    normal: { band: [50, 84], disc: [8, 999],  label: '보통' },
    hard:   { band: [34, 68], disc: [-999, 9], label: '어려움' }
  };

  function generateHints(hidden, candNames, difficulty, count, seed) {
    var cfg = DIFF[difficulty] || DIFF.normal;
    var rng = bySeed(seed || 7);
    var cands = candNames.filter(function (c) { return c !== hidden; });
    var bandMid = (cfg.band[0] + cfg.band[1]) / 2;
    var pool = [];
    for (var i = 0; i < LIST.length; i++) {
      var w = LIST[i];
      if (w.n === hidden) continue;
      if (candNames.indexOf(w.n) >= 0) continue;
      var s = similarity(hidden, w.n);
      if (s.total > 93 || s.total < 30) continue;
      var otherMax = 0, otherName = '';
      for (var k = 0; k < cands.length; k++) {
        var cs = similarity(cands[k], w.n);
        if (cs.total > otherMax) { otherMax = cs.total; otherName = cands[k]; }
      }
      var disc = s.total - otherMax;
      var minDisc = difficulty === 'easy' ? 12 : (difficulty === 'normal' ? 6 : -999);
      var qual = difficulty === 'hard' ? (disc <= 14) : (disc >= minDisc);
      var fit = 0;
      // band fit
      if (s.total >= cfg.band[0] && s.total <= cfg.band[1]) fit += 8;
      else fit += Math.max(0, 8 - Math.abs(s.total - bandMid) / 5);
      // discrimination fit
      if (difficulty === 'hard') fit += Math.max(0, 6 - Math.abs(disc) / 5);
      else fit += clamp(disc / 6, -3, 10);
      fit += rng() * 0.6;
      pool.push({ word: w.n, total: s.total, disc: disc, other: otherMax, otherName: otherName, fit: fit, qual: qual });
    }
    pool.sort(function (x, y) { return (y.qual ? 1 : 0) - (x.qual ? 1 : 0) || y.fit - x.fit; });
    var picked = [];
    var used = Object.create(null);
    var want = count || 10;
    for (var p = 0; p < pool.length && picked.length < want; p++) {
      if (used[pool[p].word]) continue;
      used[pool[p].word] = 1;
      picked.push(pool[p]);
    }
    picked.sort(function (x, y) {
      if (!!y.qual !== !!x.qual) return (y.qual ? 1 : 0) - (x.qual ? 1 : 0);
      return y.total - x.total;
    });
    return picked;
  }

  /* ---------- AI guessers (mode 2) ---------- */
  var PERSONAS = [
    { id: 'gyeong', name: '경렬 AI', style: '논리 추론형', desc: '모든 힌트의 예측 오차를 고르게 계산합니다. 오차가 작으면 망설이지 않고 제출합니다.', noise: 4, threshold: 0.45, weights: 'even' },
    { id: 'dongmin', name: '동민 AI', style: '연상 심리형', desc: '유사도가 높은 힌트에 집중하고 낮은 힌트는 흘려듣습니다. 감으로 뒤집는 판단이 잦습니다.', noise: 11, threshold: 0.95, weights: 'high' },
    { id: 'john', name: '존박 AI', style: '어휘 탐색형', desc: '최근 힌트와 형태가 닮은 후보를 우선합니다. 글자 낚시에 잘 걸립니다.', noise: 7, threshold: 0.7, weights: 'recent' }
  ];

  function gauss(rng) {
    var u = Math.max(1e-9, rng()), v = Math.max(1e-9, rng());
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  function aiVerdict(hints, candNames, persona, seed) {
    var rng = bySeed(seed || 11);
    var use = hints;
    if (persona.weights === 'recent') use = hints.slice(Math.max(0, hints.length - 5));
    // the AI hears each published score imperfectly
    var perceived = use.map(function (h) {
      return { word: h.word, total: clamp(h.total + gauss(rng) * persona.noise * 0.9, 1, 99) };
    });
    var rows = [];
    for (var i = 0; i < candNames.length; i++) {
      var c = candNames[i];
      var sum = 0, wsum = 0;
      for (var k = 0; k < perceived.length; k++) {
        var h = perceived[k];
        var wt = 1;
        if (persona.weights === 'high') wt = h.total >= 65 ? 1.8 : 0.45;
        var pred = similarity(c, h.word).total;
        sum += Math.abs(pred - h.total) * wt;
        wsum += wt;
      }
      var err0 = wsum ? sum / wsum : 99;
      var err1 = Math.max(0, err0 + gauss(rng) * 2.5);
      if (persona.weights === 'recent' && perceived.length) {
        var top = perceived[perceived.length - 1].word;
        if (shareSyllable(c, top)) err1 = Math.max(0, err1 - 6);
      }
      rows.push({ n: c, err: Math.round(err1 * 10) / 10, err0: Math.round(err0 * 10) / 10 });
    }
    rows.sort(function (x, y) { return x.err - y.err; });
    var best = rows[0], second = rows[1];
    var margin = second ? (second.err - best.err) : 99;
    var conf = margin / Math.max(5, best.err + 5);
    var decisive = best.err < 24 && conf > persona.threshold;
    if (!hints.length) {
      return { id: persona.id, name: persona.name, style: persona.style, ranking: rows, guess: null, conf: 0, margin: 0, passed: true, note: '아직 힌트가 없어 판단을 보류합니다.', perceived: [] };
    }
    var note;
    if (decisive) {
      note = '힌트 ' + use.length + '개 기준 ' + best.n + '의 예측 오차가 ' + best.err + '%p로 가장 작습니다. 확신도 ' + Math.round(clamp(conf, 0, 1) * 100) + '% — 제출합니다.';
    } else if (best.err < 26) {
      note = best.n + '이 가장 유력하지만 2순위 ' + (second ? second.n : '-') + '과 ' + (Math.round(margin * 10) / 10) + '%p 차이입니다. 확신이 서지 않아 관망합니다.';
    } else {
      note = '공개 점수와 예측이 크게 어긋납니다(최소 오차 ' + best.err + '%p). 힌트를 믿기 어려워 판단을 보류합니다.';
    }
    return {
      id: persona.id, name: persona.name, style: persona.style,
      ranking: rows, guess: decisive ? best.n : null, conf: Math.round(clamp(conf, 0, 1) * 100),
      margin: Math.round(margin * 10) / 10, passed: !decisive, note: note, perceived: perceived
    };
  }

  /* ---------- misc ---------- */
  function wordCount() { return LIST.length; }
  function stats() {
    var s = 0, a = 0, c = 0, h = 0, poly = 0;
    LIST.forEach(function (w) {
      s += w.s.length; a += w.a.length; c += w.c.length; h += w.h.length;
      if (w.poly) poly++;
    });
    return { words: LIST.length, domains: ND, syn: s, ant: a, co: c, hyper: h, poly: poly };
  }
  function randomWord(rng) {
    rng = rng || Math.random;
    return LIST[Math.floor(rng() * LIST.length)].n;
  }

  /* remote (OpenAI embeddings) — optional, testlab only */
  var REMOTE = { key: '', model: 'text-embedding-3-small', on: false };
  var ECACHE = new Map();

  function loadRemote() {
    try {
      var raw = global.localStorage && global.localStorage.getItem('hw_remote');
      if (raw) {
        var o = JSON.parse(raw);
        REMOTE.key = o.key || '';
        REMOTE.model = o.model || 'text-embedding-3-small';
        REMOTE.on = !!o.on;
      }
    } catch (e) {}
  }
  function saveRemote(o) {
    REMOTE.key = o.key || '';
    REMOTE.model = o.model || 'text-embedding-3-small';
    REMOTE.on = !!o.on;
    try {
      global.localStorage && global.localStorage.setItem('hw_remote', JSON.stringify(REMOTE));
    } catch (e) {}
  }
  loadRemote();

  function embed(text) {
    var key = 'e:' + text;
    if (ECACHE.has(key)) return Promise.resolve(ECACHE.get(key));
    var body = { model: REMOTE.model, input: text };
    return fetch('https://api.openai.com/v1/embeddings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + REMOTE.key },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (j) {
      var v = j.data[0].embedding;
      ECACHE.set(key, v);
      return v;
    });
  }

  function remoteSim(a, b) {
    if (!REMOTE.on || !REMOTE.key) return Promise.reject(new Error('off'));
    return Promise.all([embed(a), embed(b)]).then(function (vs) {
      var x = vs[0], y = vs[1], dot = 0, nx = 0, ny = 0;
      for (var i = 0; i < x.length; i++) { dot += x[i] * y[i]; nx += x[i] * x[i]; ny += y[i] * y[i]; }

        hidden: r.hidden, stage: r.stage, stageLabel: r.stageLabel, points: r.points, mult: r.mult,
        winnerNames: r.winnerNames.slice(), hinterName: r.hinterName, hinterPts: r.hinterPts,
        allWrong: r.allWrong, hintCount: r.hintCount,
        answers: r.answers.map(function (a) {
          return { name: a.name, words: a.words.slice(), hit: a.hit, piece: a.piece, isMe: a.id === pid };
        }),
        hints: r.hints.map(function (x) { return { word: x.word, total: x.total }; })
      };
    }
    return v;
  };

  /* ---------------- 저장/복구 ---------------- */
  Game.prototype.toJSON = function () {
    return {
      seed: this.seed, code: this.code, phase: this.phase, round: this.round, turn: this.turn,
      order: this.order.slice(), hostId: this.hostId,
      players: this.players.map(function (p) {
        return {
          id: p.id, name: p.name, score: p.score, pieces: p.pieces, host: !!p.host,
          connected: false, cands: (p.cands || []).slice(), hidden: p.hidden,
          used: (p.used || []).slice(), picked: !!p.picked
        };
      }),
      hints: this.hints.map(function (x) { return { word: x.word, total: x.total }; }),
      hintEnded: this.hintEnded, highlight: this.highlight,
      guesses: clone(this.guesses), reveal: clone(this.reveal), history: clone(this.history),
      roundScores: clone(this.roundScores), final: clone(this.final), usedWords: clone(this.usedWords)
    };
  };
  Game.from = function (o) {
    var g = new Game(o.seed);
    g.code = o.code; g.phase = o.phase; g.round = o.round; g.turn = o.turn;
    g.order = (o.order || []).slice(); g.hostId = o.hostId;
    g.players = (o.players || []).map(function (p) {
      return {
        id: p.id, name: p.name, score: p.score, pieces: p.pieces, host: !!p.host,
        connected: !!p.connected, cands: (p.cands || []).slice(), hidden: p.hidden || null,
        used: (p.used || []).slice(), picked: !!p.picked
      };
    });
    g.hints = (o.hints || []).slice();
    g.hintEnded = !!o.hintEnded; g.highlight = o.highlight == null ? -1 : o.highlight;
    g.guesses = o.guesses || {}; g.reveal = o.reveal || null;
    g.history = o.history || []; g.roundScores = o.roundScores || [];
    g.final = o.final || null; g.usedWords = o.usedWords || {};
    return g;
  };

  global.HWMP_CORE = {
    Game: Game, MAXP: MAXP, MINP: MINP, MAXHINT: MAXHINT,
    stageOf: stageOf, stageLabel: stageLabel, genCode: genCode
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
  'use strict';
  var HW = window.HW;
  function $(s, r) { return (r || document).querySelector(s); }

  var S = {
    mode: 'guesser',
    diff: 'normal',
    round: 1,
    rounds: 2,
    me: 0,
    ai: 0,
    pieces: 2,
    g: null,
    g2: { cands: null, hidden: null, hints: [], resolved: 0, aiLog: [], result: null, ended: false, draft: '' },
    lab: { a: '바다', b: '파도', res: null, busy: false, recent: [] }
  };

  /* ---------------- helpers ---------------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function stageOf(n) { return n <= 3 ? 1 : (n <= 7 ? 2 : 3); }
  function stagePoint(st) { return st === 1 ? 3 : (st === 2 ? 2 : 1); }
  function mult() { return S.round === 2 ? 2 : 1; }
  function stageName(st) { return st === 1 ? '1차 (힌트 1~3)' : st === 2 ? '2차 (힌트 4~7)' : '3차 (힌트 8~10)'; }

  function barColor(v) {
    if (v > 95) return 'linear-gradient(90deg,#ff8a9d,#ff5470)';
    if (v >= 70) return 'linear-gradient(90deg,#4fd8e8,#e2b74e)';
    if (v >= 40) return 'linear-gradient(90deg,#3aa8c9,#4fd8e8)';
    return 'linear-gradient(90deg,#3a3a4d,#5a5a72)';
  }
  function scoreColor(v) {
    if (v > 95) return '#ff7d90';
    if (v >= 85) return '#f3d27c';
    if (v >= 65) return '#9becf6';
    if (v >= 40) return '#b9c9d6';
    return '#8a8aa0';
  }
  function gaugeClass(v) { return v > 95 ? 'danger' : (v >= 70 ? 'mid' : 'low'); }

  var toastTimer;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2300);
  }

  function openModal(title, body) {
    $('#modal-title').textContent = title;
    $('#modal-body').innerHTML = body;
    $('#modal').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    $('#modal').classList.add('hidden');
    document.body.style.overflow = '';
  }

  /* ---------------- render ---------------- */
  function render() {
    var active = document.activeElement;
    var aid = active && active.id ? active.id : null;
    var pos = active && active.selectionStart != null ? active.selectionStart : null;

    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
      b.classList.toggle('active', b.getAttribute('data-mode') === S.mode);
    });
    renderScore();
    var html;
    if (S.mode === 'guesser') html = viewGuesser();
    else if (S.mode === 'setter') html = viewSetter();
    else if (S.mode === 'lab') html = viewLab();
    else html = (window.HWMP ? window.HWMP.view() : '');
    $('#view').innerHTML = html;

    if (aid) {
      var el = document.getElementById(aid);
      if (el && el.focus) {
        el.focus();
        try { if (pos != null && el.setSelectionRange) el.setSelectionRange(pos, pos); } catch (e) {}
      }
    }
  }

  function renderScore() {
    var sb = $('#scorebar');
    if (S.mode === 'online' && window.HWMP) {
      sb.innerHTML = window.HWMP.scorebar();
      return;
    }
    if (S.mode === 'lab') {
      var st = HW.stats();
      sb.innerHTML =
        '<div class="sb-item">내장 사전 <b>' + st.words + '</b>개 명사</div>' +
        '<div class="sb-sep"></div>' +
        '<div class="sb-item">의미 차원 <b>' + st.domains + '</b></div>' +
        '<div class="sb-sep"></div>' +
        '<div class="sb-item">' + (HW.remote.on && HW.remote.key
          ? '<span class="badge cyan">실시간 임베딩 ON</span>'
          : '<span class="badge">오프라인 엔진</span>') + '</div>';
      return;
    }
    var pips = '';
    for (var i = 0; i < 2; i++) pips += '<span class="piece' + (i < S.pieces ? ' on' : '') + '"></span>';
    sb.innerHTML =
      '<div class="sb-item">라운드 <b>' + S.round + '</b> / ' + S.rounds + '</div>' +
      (S.round === 2 ? '<span class="badge gold">배점 ×2</span>' : '') +
      '<div class="sb-sep"></div>' +
      '<div class="sb-item me">나 <b>' + S.me + '</b></div>' +
      '<div class="sb-item ai">AI <b>' + S.ai + '</b></div>' +
      '<div class="sb-sep"></div>' +
      '<div class="sb-item">피스 <span class="pieces">' + pips + '</span></div>';
  }
  function renderScorebarOnly() { renderScore(); }

  /* ---------------- mode 1 : guesser ---------------- */
  function guesserSetup() {
    var d = [
      { k: 'easy', t: '쉬움', s: '정답을 강하게 가리키는 힌트' },
      { k: 'normal', t: '보통', s: '표준 난이도' },
      { k: 'hard', t: '어려움', s: '후보들이 비슷하게 걸리는 낚시 힌트' }
    ];
    return '<div class="card">' +
      '<div class="card-head"><div class="card-title"><span class="dot"></span>AI 출제자와 대결</div>' +
      '<span class="badge gold">라운드 ' + S.round + '</span></div>' +
      '<p class="lead">AI가 후보 5개 중 하나를 <b>히든 워드</b>로 숨깁니다. 공개되는 힌트와 유사도만으로 어느 단어인지 추리하세요. ' +
      '<b>95%를 넘는 힌트</b>가 나오면 힌트 제시가 그 즉시 끝납니다.</p>' +
      '<div class="difftabs">' + d.map(function (x) {
        return '<button class="difftab' + (S.diff === x.k ? ' on' : '') + '" data-act="diff" data-diff="' + x.k + '">' + x.t + '<small>' + x.s + '</small></button>';
      }).join('') + '</div>' +
      '<button class="btn primary wide" data-act="startGuesser" style="margin-top:6px">라운드 시작</button>' +
      '</div>' +
      '<div class="card">' +
      '<div class="card-head"><div class="card-title"><span class="dot"></span>승점 구조</div></div>' +
      '<div class="kv">' +
      '<b>1차</b><span>힌트 1~3개 공개 후 정답 → 3점</span>' +
      '<b>2차</b><span>힌트 4~7개 공개 후 정답 → 2점</span>' +
      '<b>3차</b><span>힌트 8~10개 공개 후 정답 → 1점</span>' +
      '<b>실패</b><span>못 맞추면 AI 출제자가 같은 승점 획득</span>' +
      '<b>2라운드</b><span>모든 승점 2배</span>' +
      '<b>피스</b><span>1개 사용 시 답안 1개 추가 (게임당 2개)</span>' +
      '</div></div>';
  }

  function chipsHTML(g) {
    return '<div class="cands">' + g.cands.map(function (c, i) {
      var on = g.sel.indexOf(c.n) >= 0;
      var cls = 'chip';
      if (on) cls += ' sel';
      if (g.done) {
        if (c.n === g.hidden) cls += ' answer-ok';
        else if (!on) cls += ' dimmed';
      }
      return '<button class="' + cls + '" data-act="pick" data-word="' + esc(c.n) + '">' +
        '<span class="tag">' + String.fromCharCode(65 + i) + '</span>' +
        (on ? '<span class="pick">✓</span>' : '') +
        '<div class="w">' + esc(c.n) + '</div>' +
        (g.done && c.n === g.hidden ? '<div class="hintline" style="color:#5ee0a0">히든 워드</div>' : '') +
        '</button>';
    }).join('') + '</div>';
  }

  function hintsHTML(g) {
    if (!g.hints.length) {
      return '<div class="hint-empty">아직 힌트가 없습니다.<br>“힌트 받기”를 눌러 AI 출제자의 힌트를 확인하세요.</div>';
    }
    var show = g.hints.slice(0, g.shown);
    var topIdx = 0;
    show.forEach(function (h, i) { if (h.total > show[topIdx].total) topIdx = i; });
    return '<div class="hints">' + show.map(function (h, i) {
      var isTop = (g.reveal || g.done) && i === topIdx;
      return '<div class="hint' + (isTop ? ' top' : '') + '">' +
        '<div class="no">' + (i + 1) + '</div>' +
        '<div class="body">' +
        '<div class="wline"><span class="w">' + esc(h.word) + '</span>' +
        '<span class="s" style="color:' + scoreColor(h.total) + '">' + h.total + '%</span></div>' +
        '<div class="bar"><i style="width:' + h.total + '%;background:' + barColor(h.total) + '"></i></div>' +
        (isTop ? '<div style="font-size:10.5px;color:#e2b74e;margin-top:5px">가장 유사한 힌트 · 강조 공개</div>' : '') +
        '</div></div>';
    }).join('') + '</div>';
  }

  function guesserBoard(g) {
    var shown = g.shown;
    var st = stageOf(Math.max(1, shown));
    var out = '';

    out += '<div class="card">' +
      '<div class="card-head"><div class="card-title"><span class="dot"></span>후보 단어</div>' +
      '<span class="badge">' + shown + ' / 10 힌트</span></div>' +
      chipsHTML(g) +
      '<p class="lead" style="margin:11px 0 0">정답이라고 생각하는 단어를 탭하세요.' +
      (g.piece ? ' <b style="color:#9becf6">피스 사용 중 — 2개까지 선택됩니다.</b>' : '') + '</p>' +
      '</div>';

    out += '<div class="card">' +
      '<div class="card-head"><div class="card-title"><span class="dot"></span>AI 출제자의 힌트</div>' +
      '<span class="badge ' + (g.reveal ? 'gold' : '') + '">' + stageName(st) + '</span></div>' +
      '<div class="stagebar">' +
      [1, 2, 3].map(function (k) {
        return '<div class="stage' + (st === k ? ' on' : '') + '">' + k + '차</div>';
      }).join('') + '</div>' +
      hintsHTML(g) +
      (!g.done ? '<div class="row grow" style="margin-top:12px">' +
        '<button class="btn primary" data-act="hint" ' + (shown >= 10 || g.reveal ? 'disabled' : '') + '>힌트 받기</button>' +
        '<button class="btn ghost" data-act="finishHints" ' + (g.reveal || shown === 0 ? 'disabled' : '') + '>힌트 종료</button>' +
        '</div>' : '') +
      (g.reveal && !g.done ? '<p class="note gold">힌트 제시가 끝났습니다. 가장 유사한 힌트가 강조 공개되었습니다. 이제 정답을 제출하세요.</p>' : '') +
      '</div>';

    if (g.done) {
      out += resultCardGuesser(g);
    } else {
      out += '<div class="card">' +
        '<div class="card-head"><div class="card-title"><span class="dot"></span>정답 제출</div>' +
        '<span class="badge">' + (g.sel.length ? g.sel.map(esc).join(' · ') : '후보를 선택하세요') + '</span></div>' +
        '<div class="row grow">' +
        '<button class="btn ' + (g.piece ? 'cyan' : 'ghost') + '" data-act="piece" ' + (S.pieces <= 0 && !g.piece ? 'disabled' : '') + '>' +
        (g.piece ? '피스 사용 중' : '피스 사용') + ' (' + S.pieces + ')</button>' +
        '<button class="btn primary" data-act="submitGuess" ' + (g.sel.length === 0 || shown === 0 ? 'disabled' : '') + '>정답 제출</button>' +
        '</div>' +
        '<p class="lead" style="margin:10px 0 0">' + (shown === 0
          ? '힌트를 최소 1개는 확인해야 제출할 수 있습니다.'
          : '제출하면 이번 라운드가 끝납니다. 정답이면 승점, 틀리면 AI 출제자가 승점을 가져갑니다.') + '</p>' +
        '</div>';
    }
    return out;
  }

  function resultCardGuesser(g) {
    var r = g.result;
    var hit = r.hit;
    return '<div class="card">' +
      '<div class="result">' +
      '<div class="big ' + (hit ? 'ok' : 'no') + '">' + (hit ? '정답' : '오답') + '</div>' +
      '<div class="sm">히든 워드는 <b style="color:#f8e0a0">' + esc(g.hidden) + '</b> 이었습니다.</div>' +
      '<div class="sm">제출: ' + g.sel.map(esc).join(', ') + ' · ' + stageName(r.stage) + '</div>' +
      '<div class="sm" style="margin-top:8px">' + (hit
        ? '나 <span class="coin">+' + r.pts + '</span>점'
        : 'AI 출제자 <span class="coin">+' + r.pts + '</span>점') + '</div>' +
      '<div class="sm" style="margin-top:4px;color:#8a8aa0">현재 스코어 · 나 <b style="color:#f8e0a0">' + S.me + '</b> : <b style="color:#9becf6">' + S.ai + '</b> AI</div>' +
      '</div>' +
      '<div class="divider"></div>' +
      '<div class="row grow">' +
      '<button class="btn primary" data-act="nextRound">' + (S.round >= S.rounds ? '결과 확인 · 새 게임' : '다음 라운드') + '</button>' +
      '</div>' +
      '</div>';
  }

  function startGuesser() {
    var seed = (Date.now() ^ 0x9e3779b9) >>> 0;
    var rng = HW.bySeed(seed);
    var pick = null;
    for (var attempt = 0; attempt < 60; attempt++) {
      var w = HW.randomWord(rng);
      var c = HW.candidates(w, 5, rng);
      if (!c || c.length < 5) continue;
      var names = c.map(function (x) { return x.n; });
      var hs = HW.generateHints(w, names, S.diff, 10, (seed + attempt * 7919) >>> 0);
      if (hs.length >= 7) { pick = { hidden: w, cands: c, hints: hs }; break; }
    }
    if (!pick) { toast('힌트 생성에 실패했습니다. 다시 시도해 주세요.'); return; }
    if (S.diff === 'easy') {
      var namesNow = pick.cands.map(function (x) { return x.n; });
      var all = HW.words();
      for (var q = 0; q < all.length; q++) {
        if (all[q] === pick.hidden || namesNow.indexOf(all[q]) >= 0) continue;
        var ss = HW.sim(pick.hidden, all[q]);
        if (ss.total > 95) {
          pick.hints.splice(Math.min(1, pick.hints.length), 0, {
            word: all[q], total: ss.total, disc: ss.total, other: 0, otherName: '', blunder: true
          });
          if (pick.hints.length > 10) pick.hints = pick.hints.slice(0, 10);
          break;
        }
      }
    }
    S.g = {
      hidden: pick.hidden,
      cands: pick.cands,
      hints: pick.hints,
      shown: 0,
      reveal: false,
      done: false,
      sel: [],
      piece: false,
      result: null,
      seed: seed
    };
    render();
  }

  function drawHint() {
    var g = S.g;
    if (!g || g.done || g.reveal) return;
    if (g.shown >= g.hints.length) {
      g.reveal = true;
      render();
      return;
    }
    var h = g.hints[g.shown];
    g.shown++;
    if (h.total > 95) {
      g.reveal = true;
      toast('95% 초과 힌트 — 힌트 제시가 즉시 종료됩니다.');
    } else if (g.shown >= 10 || g.shown >= g.hints.length) {
      g.reveal = true;
    }
    render();
  }

  function pickCandidate(w) {
    var g = S.g;
    if (!g || g.done) return;
    var maxSel = g.piece ? 2 : 1;
    var i = g.sel.indexOf(w);
    if (i >= 0) {
      g.sel.splice(i, 1);
    } else {
      if (g.sel.length >= maxSel) g.sel.shift();
      g.sel.push(w);
    }
    render();
  }

  function togglePiece() {
    var g = S.g;
    if (!g || g.done) return;
    if (!g.piece && S.pieces <= 0) { toast('남은 피스가 없습니다.'); return; }
    g.piece = !g.piece;
    if (!g.piece && g.sel.length > 1) g.sel = g.sel.slice(0, 1);
    render();
  }

  function submitGuess() {
    var g = S.g;
    if (!g || g.done) return;
    if (!g.sel.length) { toast('후보를 선택하세요.'); return; }
    if (g.piece && S.pieces > 0) S.pieces--;
    var stage = stageOf(Math.max(1, g.shown));
    var pts = stagePoint(stage) * mult();
    var hit = g.sel.indexOf(g.hidden) >= 0;
    g.done = true;
    g.reveal = true;
    g.result = { hit: hit, stage: stage, pts: pts };
    if (hit) S.me += pts; else S.ai += pts;
    render();
  }

  function viewGuesser() { return S.g ? guesserBoard(S.g) : guesserSetup(); }

  /* ---------------- mode 2 : setter ---------------- */
  function viewSetter() {
    var g = S.g2;
    if (!g.cands) return setterSetup();
    if (!g.hidden) return setterChoose();
    return setterBoard(g);
  }

  function setterSetup() {
    return '<div class="card">' +
      '<div class="card-head"><div class="card-title"><span class="dot"></span>내가 출제자</div>' +
      '<span class="badge gold">라운드 ' + S.round + '</span></div>' +
      '<p class="lead">후보 5개 중 하나를 <b>히든 워드</b>로 정하고 힌트를 냅니다. 힌트의 유사도는 공개되지만 정답은 숨겨집니다. ' +
      'AI 플레이어 3명이 공개된 힌트로 후보를 좁혀 정답을 제출합니다.</p>' +
      '<div class="inline">' +
      '<div class="field"><label>직접 입력 (선택)</label><input id="setterWord" type="text" list="wordlist" placeholder="예: 항구" autocomplete="off"></div>' +
      '<button class="btn ghost" data-act="setterCustom">이 단어로 시작</button>' +
      '</div>' +
      '<div class="divider"></div>' +
      '<button class="btn primary wide" data-act="setterRandom">랜덤 후보 5개 받기</button>' +
      '</div>' +
      '<div class="card">' +
      '<div class="card-head"><div class="card-title"><span class="dot"></span>AI 플레이어</div></div>' +
      '<div class="personas">' + HW.personas.map(function (p) {
        return '<div class="persona"><div class="ph"><div><span class="nm">' + p.name + '</span> <span class="st">' + p.style + '</span></div></div>' +
          '<div class="say">' + p.desc + '</div></div>';
      }).join('') + '</div></div>';
  }

  function setterChoose() {
    var g = S.g2;
    return '<div class="card">' +

  function resetSetter(cands) {
    S.g2 = { cands: cands || S.g2.cands, hidden: null, hints: [], resolved: 0, aiLog: [], result: null, ended: false, draft: '' };
  }

  function setterRandom() {
    var seed = (Date.now() ^ 0x85ebca6b) >>> 0;
    var rng = HW.bySeed(seed);
    for (var i = 0; i < 40; i++) {
      var w = HW.randomWord(rng);
      var c = HW.candidates(w, 5, rng);
      if (c && c.length === 5) { resetSetter(c); render(); return; }
    }
    toast('후보 생성에 실패했습니다. 다시 시도해 주세요.');
  }

  function setterCustom() {
    var input = $('#setterWord');
    var v = (input ? input.value : '').trim();
    if (!v) { toast('단어를 입력하세요.'); return; }
    if (v.length > 12) { toast('한국어 명사 한 단어로 입력하세요.'); return; }
    var c = HW.candidates(v, 5, HW.bySeed(1234));
    if (!c || c.length < 5) { toast('이 단어로는 후보 5개를 만들 수 없습니다. 다른 명사를 입력해 보세요.'); return; }
    resetSetter(c);
    S.g2.hidden = c[0].n;
    render();
  }

  function chooseHidden(w) {
    S.g2.hidden = w;
    S.g2.hints = [];
    S.g2.resolved = 0;
    S.g2.aiLog = [];
    S.g2.result = null;
    S.g2.ended = false;
    render();
  }

  function addHint() {
    var g = S.g2;
    if (g.ended) return;
    var inp = $('#hintInput');
    var v = (inp ? inp.value : g.draft || '').trim();
    if (!v) { toast('힌트 단어를 입력하세요.'); return; }
    if (v === g.hidden) { toast('히든 워드와 같은 단어는 힌트가 될 수 없습니다.'); return; }
    if (g.hints.length >= 10) { toast('힌트는 최대 10개입니다.'); return; }
    for (var i = 0; i < g.hints.length; i++) {
      if (g.hints[i].word === v) { toast('이미 제시한 힌트입니다.'); return; }
    }
    var r = HW.sim(g.hidden, v);
    var otherMax = 0, otherWord = '';
    g.cands.forEach(function (c) {
      if (c.n === g.hidden) return;
      var cs = HW.sim(c.n, v);
      if (cs.total > otherMax) { otherMax = cs.total; otherWord = c.n; }
    });
    g.hints.push({
      word: v, total: r.total, sem: r.sem, ctx: r.ctx, rel: r.rel, relType: r.relType,
      otherMax: otherMax, otherWord: otherWord, disc: r.total - otherMax
    });
    g.draft = '';
    if (!HW.has(v)) toast('사전에 없는 단어 — 형태 유사도로 근사했습니다.');
    var n = g.hints.length;
    if (r.total > 95) {
      toast('95% 초과 — 힌트 제시가 즉시 종료됩니다.');
      resolveSetterStage(stageOf(n), true);
    } else if (n === 3 || n === 7) {
      resolveSetterStage(stageOf(n), false);
    } else if (n === 10) {
      resolveSetterStage(3, true);
    }
    render();
  }

  function endSetter() {
    var g = S.g2;
    if (!g.hints.length) { toast('힌트를 최소 1개는 제시해야 합니다.'); return; }
    var st = stageOf(g.hints.length);
    g.ended = true;
    resolveSetterStage(st, true);
    render();
  }

  function resolveSetterStage(stageNo, final) {
    var g = S.g2;
    if (g.result) return;
    var names = g.cands.map(function (c) { return c.n; });
    var hits = [];
    HW.personas.forEach(function (p, idx) {
      var seed = (stageNo * 7919 + idx * 101 + g.hints.length * 13 + 17) >>> 0;
      var v = HW.aiVerdict(g.hints, names, p, seed);
      var guesses = [];
      if (v.guess) {
        guesses.push(v.guess);
        if (stageNo === 3) {
          var second = v.ranking.filter(function (r) { return r.n !== v.guess; })[0];
          if (second) guesses.push(second.n);
        }
      }
      var hit = guesses.indexOf(g.hidden) >= 0;
      if (hit) hits.push({ name: p.name, guess: g.hidden });
      g.aiLog.push({
        stage: stageNo, id: p.id, name: p.name, style: p.style, note: v.note,
        guess: v.guess, guesses: guesses, ranking: v.ranking.slice(0, 3),
        conf: v.conf, passed: v.passed, hit: hit
      });
    });
    if (hits.length) {
      var pts = stagePoint(stageNo) * mult();
      S.ai += pts;
      g.result = { by: 'ai', stage: stageNo, pts: pts, who: hits.map(function (h) { return h.name; }).join(', ') };
      g.ended = true;
    } else if (final) {
      var pts2 = 3 * mult();
      S.me += pts2;
      g.result = { by: 'me', stage: stageNo, pts: pts2 };
      g.ended = true;
    }
  }

    render();
    var useRemote = HW.remote.on && HW.remote.key;
    var p = useRemote ? HW.simAsync(a, b) : Promise.resolve(HW.sim(a, b));
    p.then(function (r) {
      S.lab.res = r;
      S.lab.busy = false;
      if (r.ok) {
        S.lab.recent.unshift({ a: r.a, b: r.b, total: r.total });
        if (S.lab.recent.length > 5) S.lab.recent.pop();
      }
      render();
    }).catch(function (e) {
      S.lab.busy = false;
      toast('분석 실패: ' + (e && e.message ? e.message : '알 수 없는 오류'));
      render();
    });
  }
